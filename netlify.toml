# Netlify configuration — Inkwell landing page.
# Serves the blended landing at /inkwell/* (via main-site proxy). The real
# web app stays on its own Netlify site (theinkwellapp), proxied separately
# by getbacktoteaching.com's redirect rules.

[build]
  # Landing page only. The Inkwell web app lives on its own Netlify site
  # (theinkwellapp), proxied at /inkwell/app/* by the main getbacktoteaching.com site.
  command = "npm ci && INKWELL_BASE=/inkwell/ npm run build"
# Canonical landing URL redirect

[[redirects]]
  from = "/inkwell"
  to = "/inkwell/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
