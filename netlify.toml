# Netlify configuration for Inkwell unified deployment
# One site serves BOTH landing at /inkwell/ and the real Inkwell web app at /inkwell/app/
# The app bundle lands in dist/app during the build process.

[build]
  command = "npm ci && INKWELL_BASE=/inkwell/ npm run build && git clone --depth 1 https://github.com/educationlessonplans/inkwell /tmp/inkwell-app && cd /tmp/inkwell-app && npm ci && INKWELL_BASE=/inkwell/app/ npm run build && rm -rf dist-app && mkdir dist-app && cp -r dist/. dist-app/ && rm -rf \"$OLDPWD/dist/app\" && mkdir -p \"$OLDPWD/dist/app\" && cp -r dist-app/. \"$OLDPWD/dist/app/\""
  publish = "dist"

 # Real Inkwell web app SPA fallback. NOTE: the main site's proxy strips the
 # /inkwell prefix before requests land here, so origin paths start at /app/.
 # Static files under /app/ are served directly first; this only catches
 # client-side routes.
 [[redirects]]
   from = "/app/*"
   to = "/app/index.html"
   status = 200

# Canonical landing URL redirect
[[redirects]]
  from = "/inkwell"
  to = "/inkwell/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
