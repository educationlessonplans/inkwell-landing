# Netlify configuration for Inkwell unified deployment
# One site serves BOTH the landing at / and the real Inkwell web app at /inkwell/app/
# The app bundle lands in dist/inkwell/app during the build process.

[build]
  command = "bash build.sh"
  publish = "dist"

# Real Inkwell web app SPA fallback (static assets in /inkwell/app/ are served directly first)
[[redirects]]
  from = "/inkwell/app/*"
  to = "/inkwell/app/index.html"
  status = 200

# Canonical landing URL redirect
[[redirects]]
  from = "/inkwell"
  to = "/inkwell/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  # The service worker must never be cached by the browser, or updates stall.
  for = "/inkwell/app/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/inkwell/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  # Never let the app shell stay pinned to an older hashed JavaScript bundle.
  for = "/inkwell/app/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/inkwell/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "no-store"

[[redirects]]
  # Legacy compatibility only: session and entitlement routes remain held here until the dedicated production Worker is approved and attached.
  from = "/api/auth/session"
  to = "https://limiteduses.teachtylerhenley.workers.dev/api/auth/session"
  status = 200
  force = true

